<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="inventory.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo-container">
            <a href="main.html">
                <img src="logo/Logo.png" alt="Global Store Logo" class="logo">
            </a>
            <h2>Inventory Management System</h2>
        </div>
        <h2>MENU</h2>
        <ul>
            <li><a href="main.html">Dashboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="Aboutus.html">About Us</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>INVENTORY</h1>

        <div class="inventory-container">
            <div class="inventory-section">
                <h2>Inventory Items</h2>
                <div class="search-box">
                    <input type="text" id="search-bar" placeholder="Search items...">
                    <button onclick="searchInventory()" class="search-btn">Search</button>
                </div>

                <div class="inventory-list-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Stock</th>
                                <th>Price</th>
                                <th>Image</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="item-management">
                <div class="small-form">
                    <h2>Add New Item</h2>
                    <form id="inventory-form">
                        <input type="text" id="item-name" placeholder="Item Name" required>
                        <input type="number" id="item-quantity" placeholder="Quantity" required>
                        <input type="text" id="item-category" placeholder="Category" required>
                        <input type="date" id="stock-entry-date" required>
                        <input type="number" id="item-price" placeholder="Price" required>

                        <label for="item-image">Upload Image:</label>
                        <input type="file" id="item-image" accept="image/*" required>
                        <img id="preview-image" src="" alt="Image Preview" style="display: none; width: 100px; height: 100px;">

                        <button type="submit" class="btn">Add Item</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="inventory.js"></script>
</html>
